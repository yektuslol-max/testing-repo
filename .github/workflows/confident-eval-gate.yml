name: Confident PR Eval Gate
# Keep these triggers so the gate runs on every pull request (and refreshes the
# baseline on pushes to the default branch).
on:
  pull_request:
  push:
    branches: ["main"]
permissions:
  contents: read
jobs:
  eval-gate:
    runs-on: ubuntu-latest
    env:
      # Runtime secret the app needs so run() can execute (agent -> llm.py ->
      # OpenAI). Set OPENAI_API_KEY as a repository secret.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      # Managed by Confident — keep this step and its inputs as-is.
      - name: Confident PR Eval Gate
        uses: confident-ai/deepeval-tracer/actions/eval-gate@v1
        with:
          base_url: "https://api.confident-ai.com"
          dataset_alias: "Basics"
          dataset_version: "latest"
          confident_api_key: ${{ secrets.CONFIDENT_API_KEY }}
